<!--
  head-v2.html — used by layoutCPS-v2.html (version 2+ pages only)

  Load order:
    1. application.css    → govuk-frontend v4 + MoJ styles (preserves MoJ component styling)
    2. application-v2.css → govuk-frontend v5 override (cascades over v4 govuk rules)
    3. all-v2.js          → govuk-frontend v5 UMD bundle (replaces all.js for this layout)

  Version 1 pages remain on application.css + all.js and are completely untouched.
-->
