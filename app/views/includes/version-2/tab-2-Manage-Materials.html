<div class="govuk-grid-row">

    <div class="govuk-grid-column-full" id="redact_column_1">
        <div class="moj-filter-layout__filter" id="filter_Redactions">
            <!-- Force v1.2 look for version 2 -->
            {% include "./redaction_filter-from-v2.0.html" %}
        </div>
    </div>

    <div id="redact_column_2" class="govuk-grid-column-three-quarters"
         style="display: none;">
        {% include "../../version-2/partials/_redact-panel.njk" %}
    </div>

</div>

<!-- ///////////////////////////////// TAB 3 - CONTENT - END ///////////////////////////////// -->

<script>
    $(document).ready(function () {
        // Function to check for active documents and update layout
        function updateRedactLayout() {
            var $panel = $('#tab_content_2');
            if (!$panel.is(':visible')) return;

            var $redactColumn1 = $panel.find('#redact_column_1');
            var $redactColumn2 = $panel.find('#redact_column_2');
            var hasActiveDoc = $redactColumn1.find('tr.active_document').length > 0;

            if (!hasActiveDoc) {
                $redactColumn1.removeClass('govuk-grid-column-one-quarter').addClass('govuk-grid-column-full');
                $redactColumn2.hide();
            } else {
                $redactColumn1.removeClass('govuk-grid-column-full').addClass('govuk-grid-column-one-quarter');
                $redactColumn2.show();
            }
        }

        window.updateRedactLayout = updateRedactLayout;

        // Override pageActions for version 2
        var originalPageActions = window.pageActions;
        window.pageActions = function () {
            var $panel = $('#tab_content_2');
            if ($panel.is(':visible')) {
                // Requirements 1-4
                updateRedactLayout();

                // Requirement 5 is handled by global handleMenuLinkClick
            }

            // Call original if it exists
            if (typeof originalPageActions === 'function') {
                return originalPageActions();
            }
            return true;
        };

        // Run on load
        updateRedactLayout();

        // Run when a tab is clicked
        $('.tab-link').on('click', function () {
            setTimeout(updateRedactLayout, 100);
        });

        // Run when a document is selected (which adds .active_document)
        $(document).on('click', '#filter_Redactions table .openMe a, .show-case', function () {
            var $link = $(this);
            var dataId = $link.attr('data-id');
            var dataDoc = $link.attr('data-doc');
            var label = $link.text().trim();

            console.log("Document clicked in version 2:", label, dataId, dataDoc);

            // Ensure layout updates
            setTimeout(updateRedactLayout, 100);

            // The global handler in scripts.html already handles handleMenuLinkClick(label)
            // But we can be explicit if needed.
        });

        // Ensure that document links in the sidebar are properly handled
        $('.show_material').off('click').on('click', function (e) {
            e.preventDefault();
            var label = $(this).text();
            // Call the global handleMenuLinkClick if it exists
            if (typeof handleMenuLinkClick === 'function') {
                handleMenuLinkClick(label);
            } else {
                // Fallback to manually finding the link in .openMe if global not available
                console.log("Global handleMenuLinkClick not found, searching for link in .openMe");
                $(".openMe a").filter(function () {
                    return $(this).text() === label;
                }).first().click();
            }
        });
    });
</script>
